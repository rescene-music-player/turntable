<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17151d">
<title>RESCENE · PULSE Turntable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#17151d;--panel:rgba(255,255,255,.10);--line:rgba(255,255,255,.11);--ink:#f5f1fa;--muted:#aaa3b5;--accent:#e7dafa;--accent2:#c7b4e9}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(ellipse 90% 45% at 50% 0%,#494354 0%,#282530 42%,var(--bg) 100%);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
button,input{font:inherit}
.wrap{width:min(100% - 40px,1180px);margin:0 auto;padding:22px 0 28px}
.main-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:26px;align-items:start}
.stage-left{min-width:0}
.stage-right{min-width:0;display:flex;flex-direction:column;gap:12px}
.deck{margin-bottom:14px}
.stage-left .player{margin-top:0}
.stage-right .section-head{margin:2px 2px -4px}
.stage-right .playlist{padding:5px}
.stage-right .pl-row{padding:9px 10px;gap:9px}
.stage-right .pl-row+.pl-row{margin-top:0}
.stage-right .lyrics{height:clamp(250px,42vh,430px);overflow-y:auto;padding:25px 14px;mask-image:none;-webkit-mask-image:none}
@media(max-width:820px){.main-layout{grid-template-columns:1fr;gap:18px}.stage-right{gap:10px}.stage-right .lyrics{height:260px}.wrap{width:min(100% - 28px,650px)}}

.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:29px;letter-spacing:.09em;color:var(--accent);line-height:1}
.album{text-align:right;color:var(--muted);font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-style:italic;letter-spacing:.04em}
.deck{width:100%;height:auto;display:block;margin:0 auto 16px;overflow:hidden;filter:drop-shadow(0 24px 30px rgba(0,0,0,.48));touch-action:manipulation}
.deck-photo{aspect-ratio:1/1;border-radius:19px;background:#f4f4f5;border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 34px rgba(0,0,0,.34);cursor:pointer;display:flex;align-items:center;justify-content:center}
.deck-photo img{display:block;width:100%;height:100%;object-fit:contain}
.deck-photo:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.deck-photo.is-playing{box-shadow:0 24px 34px rgba(0,0,0,.34),0 0 0 1px rgba(231,218,250,.42)}
#needleContact{transition:opacity .22s}
#deck.is-playing #needleContact{opacity:1}
#deck.is-playing #arm{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.pl-row{width:100%;border:0;text-align:left;background:transparent;color:inherit;font:inherit}
.pl-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl-row .pl-tag{min-width:54px;text-align:right}
.pl-row.on .pl-tag{font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.player{padding:18px 18px 15px}
.track-meta{min-width:0}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--accent2);text-transform:uppercase;margin-bottom:6px}
.title{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.seek{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
input[type=range]{appearance:none;-webkit-appearance:none;height:3px;border-radius:4px;background:rgba(255,255,255,.18);outline:none;min-width:0}
#seek{flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(231,218,250,.12)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:16px}
.transport{display:flex;align-items:center;justify-content:center;gap:13px}
button{border:0;color:var(--ink);cursor:pointer}
.transport button{width:34px;height:34px;padding:0;background:transparent;color:#d9d2e2;font-size:19px;border-radius:50%}
.transport button:active{background:rgba(255,255,255,.1)}
#play{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#24202d;font-size:19px;box-shadow:0 5px 18px rgba(0,0,0,.2)}
.volume{display:flex;align-items:center;justify-content:flex-end;gap:7px;color:var(--muted);font-size:14px}
#vol{width:66px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px;margin:22px 2px 10px}
.section-head strong{font-size:12px;letter-spacing:.16em;font-weight:600}
.section-head span{font-family:"Cormorant Garamond",Georgia,serif;font-size:14px;color:var(--muted);font-style:italic}
.lyrics{height:190px;overflow-y:auto;text-align:center;padding:47px 14px;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lyrics::-webkit-scrollbar{display:none}
.lyrics p{margin:0;padding:6px 0;font-size:14px;line-height:1.65;color:var(--muted);opacity:.58;transition:color .25s,opacity .25s,transform .25s}
.lyric-word{display:inline;transition:color .38s ease,-webkit-text-fill-color .38s ease,text-shadow .38s ease}
.lyric-word.word-on{color:#fff;-webkit-text-fill-color:#fff;background-color:rgba(59,130,246,.24);border-radius:3px}
.lyrics p.on{color:#fff;opacity:1;font-size:17px;font-weight:600;transform:scale(1.02);text-shadow:0 0 18px rgba(231,218,250,.38)}
.playlist{padding:7px}
.pl-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 11px;border-radius:12px;cursor:pointer;transition:background .2s}
.pl-row+.pl-row{margin-top:2px}
.pl-row:hover{background:rgba(255,255,255,.045)}
.pl-row.on{background:rgba(231,218,250,.12)}
.pl-num{font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;color:var(--muted);text-align:center}
.pl-name{min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-tag{font-size:10px;color:var(--muted);letter-spacing:.08em}
.pl-row.on .pl-num,.pl-row.on .pl-name,.pl-row.on .pl-tag{color:var(--accent)}
@media(max-width:380px){.wrap{width:calc(100% - 24px);padding-top:17px}.player{padding:15px}.title{font-size:17px}.volume{gap:4px}#vol{width:52px}.transport{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">RESCENE</div><div class="album">PULSE · 4th Mini Album</div></header>
<div class="main-layout"><div class="stage-left">
<div class="deck deck-photo" id="deck" role="button" tabindex="0" aria-label="Technics SL-1300G turntable. Click to play or pause.">
 <img src="https://us.technics.com/cdn/shop/files/SL1300Gtop_1800x.jpg?v=1725511684" alt="Technics SL-1300G real product photograph" loading="eager" decoding="async">
</div>
<section class="panel player" aria-label="음악 재생 컨트롤">
  <div class="track-meta"><div class="eyebrow">Now Playing</div><div class="title" id="ttl">곡을 선택해 주세요</div></div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치"><span id="dur">0:00</span></div>
  <div class="controls">
    <span></span>
    <div class="transport"><button id="prev" aria-label="이전 곡">⏮</button><button id="play" aria-label="재생">▶</button><button id="next" aria-label="다음 곡">⏭</button></div>
    <div class="volume"><span>♪</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="음량"></div>
  </div>
</section>
</div><div class="stage-right">
<div class="section-head"><strong>TRACKLIST</strong><span>01 — 05 · SELECT A TRACK</span></div>
<section class="panel playlist" id="pl" aria-label="순서대로 정렬된 재생목록"></section>
<div class="section-head"><strong>LYRICS</strong><span>Sing along</span></div>
<section class="panel lyrics" id="lyr"><p>재생목록에서 곡을 선택하면<br>싱크 가사가 표시됩니다</p></section>
</div></div>
<script>
const $=id=>document.getElementById(id),au=new Audio();
const tracks=[
 {n:'Finest Thing',a:'tracks/01.flac'},
 {n:'With',a:'tracks/02.flac'},
 {n:'백화요란(Inside Out)',a:'tracks/03.flac'},
 {n:'MEME',a:'tracks/04.flac'},
 {n:'Dragon',a:'tracks/05.flac'}
];
let current=-1,lines=[],lyricIndex=-1,activeWordIndex=-1,timed=false;
const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
au.volume=.8;
function parseLyrics(source){
 const out=[];let hasTime=false;
 // Remove stray square brackets from lyric text while preserving [mm:ss] LRC timestamps.
 source.split(/\r?\n/).forEach(raw=>{
  const line=raw.replace(/^\s*v\d+\s*:\s*/i,'').trim();
  if(!line)return;
  // Word-synced LRC/Enhanced LRC: <mm:ss.mmm>word<mm:ss.mmm>word
  const wordRe=/<(\d+):(\d+(?:\.\d+)?)>([^<]*)/g;
  const words=[];let match;
  while((match=wordRe.exec(line))){
   const t=Number(match[1])*60+Number(match[2]);
   const x=match[3].replace(/[\[\]]/g,'');
   if(x)words.push({t,x});
  }
  if(words.length){
   hasTime=true;
   const x=words.map(w=>w.x).join('').replace(/\s+/g,' ').trim();
   if(x)out.push({t:words[0].t,x,words});
   return;
  }
  // Standard line-synced LRC
  const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;let m,times=[];
  while((m=re.exec(line)))times.push(Number(m[1])*60+Number(m[2]));
  const lyric=line.replace(re,'').replace(/[\[\]]/g,'').trim();
  if(times.length){hasTime=true;if(lyric)times.forEach(t=>out.push({t,x:lyric,words:[]}))}
  else if(lyric&&!/^\[[a-z]+:/i.test(lyric))out.push({t:-1,x:lyric,words:[]});
 });
 timed=hasTime;if(hasTime)out.sort((a,b)=>a.t-b.t);
 return out.filter(x=>!hasTime||x.t>=0);
}
function showLyrics(source,trackIndex){
 lines=parseLyrics(source);
 // Normalize the final parsed text so corrections affect both line and word-synced lyrics.
 lines.forEach(line=>{
  line.x=line.x.replace(/[\[\]]/g,'');
  if(line.words&&line.words.length)line.words.forEach(word=>{word.x=word.x.replace(/[\[\]]/g,'')});
 });
 if(trackIndex===0){
  lines.forEach(line=>{
   line.x=line.x.replace(/\bthing\]/gi,'thing');
   if(line.words)line.words.forEach(word=>{word.x=word.x.replace(/\bthing\]/gi,'thing')});
  });
 }
 if(trackIndex===2){
  // At about 01:17 the source has a standalone "From" cue followed by
  // another cue beginning "From the inside out". Keep the first cue and
  // strip only the repeated "From the" prefix from the following cue.
  lines.forEach(line=>{
   const lyric=line.x.replace(/\s+/g,' ').trim().toLowerCase();
   if(lyric==='from the'){
    line.x='From';
    if(line.words&&line.words.length){
     const first=line.words.find(word=>/^\s*from\b/i.test(word.x));
     line.words=first?[{t:first.t,x:'From'}]:[];
    }
   }
  });
  const standaloneFromTimes=lines
   .filter(line=>line.t>=65&&line.t<=95&&line.x.trim().toLowerCase()==='from')
   .map(line=>line.t);
  lines.forEach(line=>{
   const lyric=line.x.replace(/\s+/g,' ').trim();
   if(line.t<65||line.t>95||!/^from\s+the\s+inside\s+out$/i.test(lyric))return;
   if(!standaloneFromTimes.some(t=>Math.abs(line.t-t)<=5))return;
   if(line.words&&line.words.length){
    let stage=0;
    const kept=[];
    line.words.forEach(word=>{
     let x=word.x;
     if(stage===0){
      const m=x.match(/^\s*from\b\s*/i);
      if(m){x=x.slice(m[0].length);stage=1;}
     }
     if(stage===1){
      const m=x.match(/^\s*the\b\s*/i);
      if(m){x=x.slice(m[0].length);stage=2;}
     }
     if(x)kept.push({...word,x});
    });
    line.words=kept;
    line.x=kept.map(word=>word.x).join('').replace(/\s+/g,' ').trim();
   }else{
    line.x=line.x.replace(/^from\s+the\s+/i,'');
   }
  });
  // Around 03:17 the complete phrase is duplicated. Keep the first cue
  // and remove only another identical phrase within the same passage.
  let keptPhraseTime=null;
  lines=lines.filter(line=>{
   const lyric=line.x.replace(/\s+/g,' ').trim().toLowerCase();
   if(lyric!=='from inside out'||line.t<185||line.t>210)return true;
   if(keptPhraseTime!==null&&line.t-keptPhraseTime<8)return false;
   keptPhraseTime=line.t;
   return true;
  });
 }
 if(trackIndex===1){
  // Repair the opening word after parsing, where FLAC word timestamps may split it.
  lines.forEach(line=>{
   if(line.words&&line.words.length){
    const first=line.words.findIndex(word=>word.x.trim());
    if(first>=0){
     const a=line.words[first],b=line.words[first+1];
     if(/^o$/i.test(a.x.trim())&&b&&/^u(?:\b|['’])/i.test(b.x.trim())){
      a.x='You'+b.x.trim().slice(1);
      b.x='';
     }else{
      a.x=a.x.replace(/^ou(?=\b|['’])/i,'You');
     }
    }
    line.words=line.words.filter(word=>word.x);
    line.x=line.words.map(word=>word.x).join('').replace(/\s+/g,' ').trim();
   }
   // Final guard for line-synced lyrics and the first displayed word.
   line.x=line.x.replace(/^ou(?=\b|['’])/i,'You');
  });
 }
 lyricIndex=-1;const box=$('lyr');box.innerHTML='';
 lines.forEach(line=>{
  const p=document.createElement('p');
  if(line.words&&line.words.length){
   line.words.forEach(word=>{
    const span=document.createElement('span');span.className='lyric-word';span.dataset.t=word.t;span.textContent=word.x;p.appendChild(span);
   });
  }else p.textContent=line.x;
  if(timed)p.onclick=()=>{au.currentTime=line.t};box.appendChild(p);
 });
 if(!lines.length)box.innerHTML='<p>등록된 가사가 없습니다</p>';
}
function render(){
 const list=$('pl');list.innerHTML='';
 tracks.forEach((track,i)=>{
  const row=document.createElement('button');row.type='button';row.className='pl-row'+(i===current?' on':'');row.setAttribute('aria-pressed',String(i===current));
  const num=document.createElement('span');num.className='pl-num';num.textContent=String(i+1).padStart(2,'0');
  const name=document.createElement('span');name.className='pl-name';name.textContent=track.n;
  const tag=document.createElement('span');tag.className='pl-tag';tag.textContent=i===current?'PLAYING':'FLAC';
  row.append(num,name,tag);row.onclick=()=>playTrack(i);list.appendChild(row);
 });
}
async function readFlacLyrics(path){
 const readComments=buffer=>{
  const bytes=new Uint8Array(buffer),view=new DataView(buffer);
  if(bytes.length<8||String.fromCharCode(...bytes.slice(0,4))!=='fLaC')return null;
  let pos=4;
  while(pos+4<=bytes.length){
   const header=bytes[pos],type=header&127;
   const size=(bytes[pos+1]<<16)|(bytes[pos+2]<<8)|bytes[pos+3];
   const begin=pos+4,finish=begin+size;
   if(finish>bytes.length)return null;
   if(type===4){
    let p=begin;
    const vendorLen=view.getUint32(p,true);p+=4+vendorLen;
    if(p+4>finish)return null;
    const count=view.getUint32(p,true);p+=4;
    const tags={};
    for(let i=0;i<count&&p+4<=finish;i++){
     const len=view.getUint32(p,true);p+=4;
     if(p+len>finish)return null;
     const item=new TextDecoder('utf-8').decode(bytes.subarray(p,p+len));p+=len;
     const eq=item.indexOf('=');
     if(eq>0)tags[item.slice(0,eq).toUpperCase()]=item.slice(eq+1);
    }
    return tags.SYNCEDLYRICS||tags.LYRICS||tags.UNSYNCEDLYRICS||'';
   }
   pos=finish;
   if(header&128)break;
  }
  return null;
 };
 try{
  let response=await fetch(path,{headers:{Range:'bytes=0-1048575'}});
  if(!response.ok)throw new Error('FLAC metadata fetch failed');
  let buffer=await response.arrayBuffer(),lyrics=readComments(buffer);
  if(lyrics===null){
   response=await fetch(path);
   if(!response.ok)throw new Error('FLAC fetch failed');
   buffer=await response.arrayBuffer();lyrics=readComments(buffer);
  }
  return lyrics||'';
 }catch(error){console.warn('내장 가사를 읽지 못했습니다:',error);return ''}
}
function correctTrackLyrics(trackIndex,source){
 if(trackIndex===0){
  // Remove only the stray closing bracket after "thing".
  source=source.replace(/\bthing\]/gi,'thing');
  // Add the missing intro. The track's first verse begins at about 00:09;
  // these opening cues are placed across the 0–9 second intro.
  if(!/Shine or 24-karat rings/i.test(source)){
   source='v1: <00:00.000>Shine <00:00.525>or <00:00.625>24-<00:01.177>karat <00:01.744>rings\n'+
    'v1: <00:02.188>Choose <00:02.533>what <00:02.633>deepens <00:02.955>over <00:03.421>time\n'+
    'v1: <00:04.225>Cha-<00:04.535>Ching\n'+
    'v1: <00:05.110>Never <00:05.359>chase <00:05.533>the <00:05.669>fleeting <00:06.197>things\n'+
    'v1: <00:06.700>I\'m <00:06.987>the <00:07.417>finest <00:08.351>thing\n'+source;
  }
 }
 if(trackIndex===1){
  // Correct every standalone "Ou" occurrence in the With lyrics, regardless of case or position.
  source=source.replace(/\bou\b/gi,'you');
 }
 return source;
}
function playTrack(i){
 if(i<0||i>=tracks.length)return;
 current=i;const track=tracks[i];au.src=track.a;
 $('ttl').textContent=track.n;$('cur').textContent='0:00';$('seek').value=0;
 $('lyr').innerHTML='<p>내장 가사를 읽는 중입니다</p>';
 readFlacLyrics(track.a).then(text=>{if(current===i){if(text)showLyrics(correctTrackLyrics(i,text),i);else $('lyr').innerHTML='<p>이 FLAC 파일에 읽을 수 있는 가사 태그가 없습니다</p>'}});
 au.play().catch(()=>{$('play').textContent='▶'});
 render();
}
function toggle(){if(!au.src){playTrack(0);return}if(au.paused)au.play().catch(()=>{});else au.pause()}
$('play').onclick=toggle;$('deck').onclick=toggle;
$('deck').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
$('next').onclick=()=>playTrack((current+1+tracks.length)%tracks.length);
$('prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else playTrack((current-1+tracks.length)%tracks.length)};
au.onended=()=>$('next').click();
au.onplay=()=>$('play').textContent='Ⅱ';
au.onpause=()=>$('play').textContent='▶';
au.onloadedmetadata=()=>$('dur').textContent=fmt(au.duration);
au.ontimeupdate=()=>{$('cur').textContent=fmt(au.currentTime);if(au.duration&&document.activeElement!==$('seek'))$('seek').value=au.currentTime/au.duration*1000};
$('vol').oninput=e=>au.volume=Number(e.target.value)/100;
$('seek').oninput=e=>{if(au.duration)au.currentTime=Number(e.target.value)/1000*au.duration};
function syncLyrics(){
 if(!timed)return;
 const t=au.currentTime,nodes=$('lyr').children;
 let found=-1;
 for(let i=0;i<lines.length;i++){if(lines[i].t<=t)found=i;else break}
 // The final lyric has no following timestamp to end its highlight.
 // Release it shortly after its final word instead of leaving it lit forever.
 if(found===lines.length-1&&found>=0){
  const last=lines[found],words=last.words||[];
  const finalCue=words.length?words[words.length-1].t:last.t;
  if(t>finalCue+2.5)found=-1;
 }
 if(found!==lyricIndex){
  if(lyricIndex>=0&&nodes[lyricIndex]){
   nodes[lyricIndex].classList.remove('on');
   nodes[lyricIndex].querySelectorAll('.lyric-word.word-on').forEach(span=>span.classList.remove('word-on'));
  }
  lyricIndex=found;activeWordIndex=-1;
  [...nodes].forEach((node,i)=>node.classList.toggle('on',i===found));
  if(found>=0)$('lyr').scrollTop=nodes[found].offsetTop-$('lyr').clientHeight/2+nodes[found].clientHeight/2;
 }
 if(found>=0&&lines[found].words&&lines[found].words.length){
  const words=lines[found].words;let active=-1;
  for(let i=0;i<words.length;i++){if(words[i].t<=t)active=i;else break}
  if(active!==activeWordIndex){
   activeWordIndex=active;
   const spans=nodes[found].querySelectorAll('.lyric-word');
   spans.forEach((span,i)=>span.classList.toggle('word-on',i===active));
  }
 }
}
let previous=performance.now();
function animate(now){
 const dt=Math.min(.05,(now-previous)/1000);previous=now;
 syncLyrics();
 const playing=!au.paused&&!au.ended;
 $('deck').classList.toggle('is-playing',playing);
 requestAnimationFrame(animate);
}
render();requestAnimationFrame(animate);
</script>
