:root{color-scheme:dark;--bg:#151b20;--panel:rgba(224,231,235,.075);--line:rgba(215,225,231,.13);--ink:#f3eff3;--muted:#aab2b8;--accent:#d9cce1;--accent2:#b8c6ce}
*{box-sizing:border-box}
body{-webkit-user-select:none;user-select:none;caret-color:transparent;cursor:default}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{position:relative;isolation:isolate;margin:0;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(ellipse 90% 45% at 50% 0%,#46535b 0%,#2a343b 42%,var(--bg) 100%);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:-22%;z-index:-1;pointer-events:none;filter:blur(48px);background:radial-gradient(ellipse at 18% 25%,rgba(157,190,211,.27) 0%,transparent 24%),radial-gradient(ellipse at 76% 18%,rgba(194,169,214,.24) 0%,transparent 23%),radial-gradient(ellipse at 82% 76%,rgba(105,157,185,.2) 0%,transparent 27%),radial-gradient(ellipse at 24% 82%,rgba(133,157,180,.15) 0%,transparent 26%)}
button,input{font:inherit}
.wrap{width:min(100% - 40px,862px);min-height:100vh;margin:0 auto;padding:24px 0;display:flex;align-items:center}

.stage-left{min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}

.pl-row{width:100%;border:0;text-align:left;background:transparent;color:inherit;font:inherit}

.panel{position:relative;isolation:isolate;overflow:hidden;background:rgba(205,221,232,.075);border:1px solid rgba(237,247,255,.42);border-radius:25px;backdrop-filter:blur(1px) saturate(1) contrast(1);-webkit-backdrop-filter:blur(1px) saturate(1) contrast(1);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.08),0 18px 48px rgba(0,0,0,.32),0 3px 14px rgba(176,213,235,.09)}
.panel::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse 80% 45% at 15% -8%,rgba(255,255,255,.2),transparent 65%)}
.panel::after{content:"";position:absolute;inset:1px;z-index:1;pointer-events:none;border-radius:inherit;border:1px solid rgba(255,255,255,.19);box-shadow:inset 0 1px 1px rgba(255,255,255,.48),inset 0 -1px 0 rgba(255,255,255,.16)}
.panel>*{position:relative;z-index:2}

#seek{flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(231,218,250,.12)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}
.controls{display:flex;justify-content:center;align-items:center;margin-top:16px}

.section-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px;margin:22px 2px 10px}

.lyrics{height:190px;overflow-y:auto;text-align:center;padding:47px 14px;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lyrics::-webkit-scrollbar{display:none}

.lyric-word{display:inline;transition:none}
.lyric-word.word-on{color:#fff;-webkit-text-fill-color:#fff;background:none;text-shadow:0 0 2px rgba(255,255,255,.95),0 0 5px rgba(87,170,255,.95),0 0 11px rgba(55,145,255,.88),0 0 21px rgba(40,120,255,.66),0 0 34px rgba(40,120,255,.42)}
.lyrics p.on{color:#fff;opacity:1;font-size:17px;font-weight:600;transform:scale(1.02);text-shadow:0 0 18px rgba(231,218,250,.38)}
.playlist{padding:7px}
.pl-row{appearance:none;-webkit-appearance:none;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 11px;border:0;border-radius:0;outline:none;background:transparent;box-shadow:none;cursor:pointer;transition:color .2s}
.pl-row+.pl-row{margin-top:2px}

.pl-row.on{background:transparent;border:0;border-radius:0;box-shadow:none;outline:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.pl-num{font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;color:var(--muted);text-align:center}
.pl-name{min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pl-row.on .pl-num,.pl-row.on .pl-name,.pl-row.on .pl-tag{color:var(--accent)}

/* True backdrop refraction in Chromium; other engines keep the blur fallback. */
@supports (-webkit-app-region: inherit){
 .panel{-webkit-backdrop-filter:url(#liquid-refraction) blur(1px) saturate(1.55) contrast(1.08);backdrop-filter:url(#liquid-refraction) blur(1px) saturate(1.55) contrast(1.08)}
 .pl-row.on{-webkit-backdrop-filter:url(#liquid-refraction) blur(.7px) saturate(1.5);backdrop-filter:url(#liquid-refraction) blur(.7px) saturate(1.5)}
 #play{-webkit-backdrop-filter:url(#liquid-refraction) blur(.5px) saturate(1.6);backdrop-filter:url(#liquid-refraction) blur(.5px) saturate(1.6)}
}

/* Stabilize the auto-scrolling lyrics viewport.
   SVG backdrop refraction on a scrolling text layer can leave compositing smears.
   Keep Liquid Glass on the other panels, but use a stable translucent material here. */
.panel.lyrics{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  background:rgba(205,221,232,.055);
  overflow-anchor:none;
  overscroll-behavior:contain;
}
.panel.lyrics::after{display:none}
.lyrics p{
  transition:color .18s ease,opacity .18s ease;
}
.lyrics p.on{
  font-size:14px;
  font-weight:600;
  transform:none;
  text-shadow:none;
}


.vinyl-stage{display:grid;place-items:center;width:min(100%,420px);aspect-ratio:1;margin:0 auto 17px}
.vinyl-record{
  position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,transparent 0 17.8%,rgba(255,255,255,.22) 18%,rgba(0,0,0,.72) 18.35%,transparent 18.8%),
    repeating-radial-gradient(circle at 50% 50%,#17191c 0px,#303238 1px,#111316 2px,#25282c 3px,#15171a 4px),
    radial-gradient(circle at 35% 26%,#555a60 0%,#202328 40%,#080a0d 78%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 24px 48px rgba(0,0,0,.48),inset 0 0 0 2px rgba(255,255,255,.045),inset 0 0 28px rgba(0,0,0,.9);
  animation:vinyl-spin 1.8s linear infinite;
  animation-play-state:paused;
  will-change:transform;
}
.vinyl-record::before{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(ellipse 47% 18% at 28% 13%,rgba(255,255,255,.2),transparent 75%),
    conic-gradient(from 215deg at 50% 50%,transparent 0deg,rgba(255,255,255,.12) 32deg,transparent 68deg,transparent 360deg);
  mix-blend-mode:screen;
}
.vinyl-record::after{
  content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.09);
  border-radius:50%;pointer-events:none;box-shadow:inset 0 0 16px rgba(0,0,0,.7);
}
.vinyl-record.is-playing{animation-play-state:running}
.vinyl-label{
  position:absolute;z-index:2;left:50%;top:50%;width:37%;aspect-ratio:1;
  transform:translate(-50%,-50%);overflow:hidden;border-radius:50%;
  border:2px solid rgba(12,13,16,.95);
  box-shadow:0 0 0 1px rgba(255,255,255,.28),0 2px 12px rgba(0,0,0,.55);
}
.vinyl-art{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.vinyl-spindle{
  position:absolute;z-index:3;left:50%;top:50%;width:7px;height:7px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#aeb3b9 0%,#41464c 55%,#111 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.75),0 0 2px rgba(255,255,255,.35);
  pointer-events:none;
}
@keyframes vinyl-spin{to{transform:rotate(360deg)}}

  background-position:center;

.transport button.mode-toggle.mode-on{

/* True seven-row viewport: real spacer elements, exactly 3 + current + 3. */
.stage-right .lyrics{

/* Liquid Glass material uses article-generated optical maps. No cloned background or painted gradients. */
.player,.stage-right .playlist{
  position:relative!important;
  isolation:isolate!important;
  overflow:hidden!important;
  background:rgba(179,205,238,.075)!important;
  border-radius:24px!important;
  border:1px solid rgba(232,243,255,.22)!important;

    inset 0 1px 0 rgba(255,255,255,.28),

}
.stage-right .playlist{

  outline:0!important;
  border-radius:21px!important;
  background:rgba(179,205,238,.065)!important;
}
.player::before,.player::after,
.stage-right .playlist::before,.stage-right .playlist::after{

    -webkit-backdrop-filter:blur(1px)!important;
    backdrop-filter:blur(1px)!important;
  }

/* Per-track paired side images, softly revealed behind the player. */
.track-backdrops{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.track-backdrops img{
  position:absolute;
  top:50%;
  width:clamp(120px,24vw,420px);
  height:min(74svh,740px);
  max-height:calc(100svh - 32px);
  object-fit:cover;
  object-position:center;
  border-radius:22px;
  opacity:0;
  transform:translate3d(0,-50%,0) scale(.985);
  filter:none;
  -webkit-filter:none;
  box-shadow:0 22px 60px rgba(0,0,0,.28);
  transition:opacity 1.35s cubic-bezier(.2,.65,.25,1),transform 1.35s cubic-bezier(.2,.65,.25,1);
  will-change:opacity,transform;
}
#trackBackdropLeft{left:clamp(0px,calc((100vw - 1440px)/2 + 24px),160px)}
#trackBackdropRight{right:clamp(0px,calc((100vw - 1440px)/2 + 24px),160px)}
.track-backdrops img.is-visible{
  opacity:1;
  transform:translate3d(0,-50%,0) scale(1);
}
.wrap{position:relative;z-index:1}

/* Requested vertical breathing room: 10px above and below both panels. */
.stage-left .player,
.stage-right .playlist{
  padding-top:10px!important;
  padding-bottom:10px!important;
  padding-left:10px!important;
  padding-right:10px!important;
}
@media(max-width:820px){
  .track-backdrops img{
    width:clamp(100px,25vw,220px);
    height:min(66svh,620px);
    filter:none;
    -webkit-filter:none;
  }
  #trackBackdropLeft{left:0}
  #trackBackdropRight{right:0}
}
@media(prefers-reduced-motion:reduce){
  .track-backdrops img{transition:none!important}
}



/* Clean, genuinely translucent Liquid Glass.
   Avoid the per-control SVG displacement maps: their low-resolution sampling
   caused visible grain on small buttons and made the panels look opaque. */
.player,
.stage-right .playlist{
  position:relative!important;
  isolation:auto!important;
  overflow:hidden!important;
  background:rgba(190,212,238,.055)!important;
  border:1px solid rgba(235,245,255,.22)!important;
  border-radius:24px!important;
  -webkit-backdrop-filter:blur(1px) saturate(1.08)!important;
  backdrop-filter:blur(1px) saturate(1.08)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.34),
    inset 1px 0 0 rgba(255,255,255,.10),
    inset -1px 0 0 rgba(255,255,255,.08),
    0 12px 30px rgba(0,0,0,.20)!important;
}
.stage-right .playlist{
  background:rgba(190,212,238,.05)!important;
  border-radius:21px!important;
}
.player::before,
.player::after,
.stage-right .playlist::before,
.stage-right .playlist::after{
  content:none!important;
  display:none!important;
}
.player>*,
.stage-right .playlist>*{
  position:relative;
  z-index:2;
}

/* Native backdrop blur keeps the transport controls smooth and clean. */
.transport button,
.transport button#play{
  isolation:auto!important;
  overflow:hidden!important;
  background:rgba(205,225,246,.075)!important;
  border:1px solid rgba(240,248,255,.25)!important;
  -webkit-backdrop-filter:blur(1px) saturate(1)!important;
  backdrop-filter:blur(1px) saturate(1)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 5px 14px rgba(0,0,0,.16)!important;
  filter:none!important;
  -webkit-filter:none!important;
}
.transport button::before,
.transport button::after{
  content:none!important;
  display:none!important;
}
.transport button#play{
  background:rgba(215,231,250,.12)!important;
  border-color:rgba(245,250,255,.34)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.40),
    0 7px 18px rgba(0,0,0,.20)!important;
}

/* Do not cover the side photographs: the transparent panels reveal them
   through the glass, including on narrower desktop/mobile viewports. */
.track-backdrops{
  z-index:0!important;
}
.wrap{
  z-index:1!important;
  background:transparent!important;
}

<script>
const $=id=>document.getElementById(id),au=new Audio();

/* Kube-style Liquid Glass: physically-derived squircle displacement + specular maps. */
const LIQUID_GLASS_NS='http://www.w3.org/2000/svg';
function liquidConvexSquircle(x){
  return Math.pow(Math.max(0,1-Math.pow(1-x,4)),0.25);
}
function liquidDisplacementProfile(glassThickness,bezelWidth,refractiveIndex,samples=128){
  const eta=1/refractiveIndex;
  const refract=(normalX,normalY)=>{
    const dot=normalY;
    const k=1-eta*eta*(1-dot*dot);
    if(k<0)return null;
    const root=Math.sqrt(k);
    return [-(eta*dot+root)*normalX,eta-(eta*dot+root)*normalY];
  };
  return Array.from({length:samples},(_,i)=>{
    const x=i/samples;
    const y=liquidConvexSquircle(x);
    const dx=x<1?0.0001:-0.0001;
    const nextX=Math.max(0,Math.min(1,x+dx));
    const derivative=(liquidConvexSquircle(nextX)-y)/(nextX-x);
    const magnitude=Math.sqrt(derivative*derivative+1);
    const normalX=-derivative/magnitude;
    const normalY=-1/magnitude;
    const ray=refract(normalX,normalY);
    if(!ray||Math.abs(ray[1])<1e-7)return 0;
    const remainingHeight=y*bezelWidth+glassThickness;
    const displacement=ray[0]*(remainingHeight/ray[1]);
    return Number.isFinite(displacement)?displacement:0;
  });
}
function liquidImageDataToUrl(imageData){
  const canvas=document.createElement('canvas');
  canvas.width=imageData.width;
  canvas.height=imageData.height;
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('Liquid Glass canvas context unavailable');
  ctx.putImageData(imageData,0,0);
  return canvas.toDataURL('image/png');
}
function liquidCreateDisplacementImage(width,height,radius,bezelWidth,profile,dpr=2){
  const bufferWidth=Math.max(1,Math.round(width*dpr));
  const bufferHeight=Math.max(1,Math.round(height*dpr));
  const canvas=document.createElement('canvas');
  canvas.width=bufferWidth;canvas.height=bufferHeight;
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('Liquid Glass displacement canvas unavailable');
  const imageData=ctx.createImageData(bufferWidth,bufferHeight);
  const data=imageData.data;
  for(let i=0;i<data.length;i+=4){data[i]=128;data[i+1]=128;data[i+2]=0;data[i+3]=255;}

  const r=radius*dpr,b=bezelWidth*dpr;
  const r2=r*r,rPlus2=(r+1)*(r+1),rMinus2=(r-b)*(r-b);
  const objectWidth=width*dpr,objectHeight=height*dpr;
  const horizontalFlat=objectWidth-r*2,verticalFlat=objectHeight-r*2;
  const offsetX=(bufferWidth-objectWidth)/2,offsetY=(bufferHeight-objectHeight)/2;
  const maxEncodingDisplacement=100;

  for(let y1=0;y1<objectHeight;y1++){
    for(let x1=0;x1<objectWidth;x1++){
      const x=x1<r?x1-r:x1>=objectWidth-r?x1-r-horizontalFlat:0;
      const y=y1<r?y1-r:y1>=objectHeight-r?y1-r-verticalFlat:0;
      const distance2=x*x+y*y;
      if(distance2>rPlus2||distance2<rMinus2)continue;
      const distance=Math.sqrt(distance2);
      const opacity=distance2<r2?1:Math.max(0,1-(distance-r)/(Math.sqrt(rPlus2)-r));
      const distanceFromSide=r-distance;
      const index=Math.floor(distanceFromSide/b*profile.length);
      const displacement=profile[index]??0;
      const cos=distance?x/distance:0;
      const sin=distance?y/distance:0;

    {selector:'.stage-left .player',id:'rescene-player-glass',radius:24,bezel:17,thickness:78,index:.40},
    {selector:'.stage-right .playlist',id:'rescene-playlist-glass',radius:21,bezel:15,thickness:72,index:.40},
    {selector:'#shuffle',id:'rescene-shuffle-glass',radius:16,bezel:11,thickness:38,index:.40},
    {selector:'#prev',id:'rescene-prev-glass',radius:16,bezel:11,thickness:38,index:.40},

    {selector:'#next',id:'rescene-next-glass',radius:16,bezel:11,thickness:38,index:.40},
    {selector:'#repeat',id:'rescene-repeat-glass',radius:16,bezel:11,thickness:38,index:.40}
  ];
  specs.forEach(spec=>{
    const element=document.querySelector(spec.selector);
    if(!element)return;
    let lastSize='';
    const apply=()=>{
      const rect=element.getBoundingClientRect();
      const width=Math.max(1,Math.round(rect.width));
      const height=Math.max(1,Math.round(rect.height));

        element.style.webkitBackdropFilter='blur(1px) saturate(1)';

   buffer=await response.arrayBuffer();lyrics=readComments(buffer);
  }
  return lyrics||'';
 }catch(error){console.warn('내장 가사를 읽지 못했습니다:',error);return ''}
}
function correctTrackLyrics(trackIndex,source){
 if(trackIndex===0){
  // Remove only the stray closing bracket after "thing".
  source=source.replace(/\bthing\]/gi,'thing');
  // Add the missing intro. The track's first verse begins at about 00:09;
  // these opening cues are placed across the 0–9 second intro.
  if(!/Shine or 24-karat rings/i.test(source)){
   source='v1: <00:00.000>Shine <00:00.525>or <00:00.625>24-<00:01.177>karat <00:01.744>rings\n'+
    'v1: <00:02.188>Choose <00:02.533>what <00:02.633>deepens <00:02.955>over <00:03.421>time\n'+
    'v1: <00:04.225>Cha-<00:04.535>Ching\n'+
    'v1: <00:05.110>Never <00:05.359>chase <00:05.533>the <00:05.669>fleeting <00:06.197>things\n'+
    'v1: <00:06.700>I\'m <00:06.987>the <00:07.417>finest <00:08.351>thing\n'+source;
  }
 }
 if(trackIndex===1){
  // Correct every standalone "Ou" occurrence in the With lyrics, regardless of case or position.
  source=source.replace(/\bou\b/gi,'you');
 }
 return source;
}
function playTrack(i){
 if(i<0||i>=tracks.length)return;
 current=i;const track=tracks[i];setTrackBackdrop(i);au.volume=1;au.src=track.a;
 $('ttl').textContent=track.n;$('cur').textContent='0:00';$('seek').value=0;
 $('lyr').innerHTML='<p>내장 가사를 읽는 중입니다</p>';
 readFlacLyrics(track.a).then(text=>{if(current===i){if(text)showLyrics(correctTrackLyrics(i,text),i);else $('lyr').innerHTML='<p>이 FLAC 파일에 읽을 수 있는 가사 태그가 없습니다</p>'}});
 au.play().catch(()=>{$('play').textContent='▶'});
 render();
}
function toggle(){if(!au.src){playTrack(0);return}au.volume=1;if(au.paused)au.play().catch(()=>{});else au.pause()}
$('play').onclick=toggle;
function randomTrackIndex(){
 if(tracks.length<2)return current<0?0:current;
 let next=current;
 while(next===current)next=Math.floor(Math.random()*tracks.length);
 return next;
}
$('shuffle').onclick=()=>{
 shuffleEnabled=!shuffleEnabled;
 $('shuffle').classList.toggle('mode-on',shuffleEnabled);
 $('shuffle').setAttribute('aria-pressed',String(shuffleEnabled));
};
$('repeat').onclick=()=>{
 repeatEnabled=!repeatEnabled;
 $('repeat').classList.toggle('mode-on',repeatEnabled);
 $('repeat').setAttribute('aria-pressed',String(repeatEnabled));
};
$('next').onclick=()=>playTrack(shuffleEnabled?randomTrackIndex():(current+1+tracks.length)%tracks.length);
$('prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else playTrack((current-1+tracks.length)%tracks.length)};
au.onended=()=>{
 if(repeatEnabled){au.currentTime=0;au.play().catch(()=>{});return}
 $('next').click();
};
au.onplay=()=>{$('play').textContent='Ⅱ';$('vinylRecord').classList.add('is-playing')};
au.onpause=()=>{$('play').textContent='▶';$('vinylRecord').classList.remove('is-playing')};
au.onloadedmetadata=()=>$('dur').textContent=fmt(au.duration);
au.ontimeupdate=()=>{$('cur').textContent=fmt(au.currentTime);if(au.duration){const progress=au.currentTime/au.duration*100;$('seek').style.setProperty('--progress',progress+'%');if(document.activeElement!==$('seek'))$('seek').value=progress*10}};
$('seek').oninput=e=>{if(au.duration){au.currentTime=Number(e.target.value)/1000*au.duration;$('seek').style.setProperty('--progress',(Number(e.target.value)/10)+'%')}};
function syncLyrics(){
 if(!timed)return;
 const t=au.currentTime,nodes=$('lyr').querySelectorAll('p');
 let found=-1;
 for(let i=0;i<lines.length;i++){if(lines[i].t<=t)found=i;else break}
 // The final lyric has no following timestamp to end its highlight.
 // Release it shortly after its final word instead of leaving it lit forever.
 if(found===lines.length-1&&found>=0){
  const last=lines[found],words=last.words||[];
  const finalCue=words.length?words[words.length-1].t:last.t;
  if(t>finalCue+2.5)found=-1;
 }
 if(found!==lyricIndex){
  if(lyricIndex>=0&&nodes[lyricIndex]){
   nodes[lyricIndex].classList.remove('on');
   nodes[lyricIndex].querySelectorAll('.lyric-word.word-on').forEach(span=>span.classList.remove('word-on'));
  }
  lyricIndex=found;activeWordIndex=-1;
  [...nodes].forEach((node,i)=>node.classList.toggle('on',i===found));
  if(found>=0){
   const box=$('lyr'),boxRect=box.getBoundingClientRect(),lineRect=nodes[found].getBoundingClientRect();
   lyricScrollTarget=Math.max(0,box.scrollTop+lineRect.top-boxRect.top-box.clientHeight/2+lineRect.height/2);
  }
 }
 if(found>=0&&lines[found].words&&lines[found].words.length){
  const words=lines[found].words;let active=-1;
  for(let i=0;i<words.length;i++){if(words[i].t<=t)active=i;else break}
  if(active!==activeWordIndex){
   activeWordIndex=active;
   const spans=nodes[found].querySelectorAll('.lyric-word');
   spans.forEach((span,i)=>span.classList.toggle('word-on',i===active));
  }
 }
}
let previous=performance.now();
function animate(now){
 const dt=Math.min(.05,Math.max(0,(now-previous)/1000));previous=now;
 syncLyrics();
 const lyricBox=$('lyr');
 const scrollDelta=lyricScrollTarget-lyricBox.scrollTop;
 lyricBox.scrollTop+=scrollDelta*(1-Math.exp(-dt*6.5));
 requestAnimationFrame(animate);
}
render();requestAnimationFrame(animate);
</script>
</body>
</html>
